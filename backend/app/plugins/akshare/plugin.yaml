name: akshare
display_name: "AkShare"
runtime: python
entry: app.plugins.akshare.provider:AkShareProvider
check: app.plugins.akshare.provider:availability
datasets: [daily, adj_factor, financial, minute, realtime]
description: "AkShare Sina 原始日K、近期分钟K、A股/指数快照、股票除权事件、季度财报和 CNINFO 公告时点股本；不提供全市场分钟流和五档盘口。"
install_hint: "在数据源卡片中安装 AkShare 依赖；无需 API Key。"
homepage: "https://github.com/akfamily/akshare"
